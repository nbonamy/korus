limit_req_zone $binary_remote_addr zone=__API_ZONE___console_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=__API_ZONE___console_connections:10m;
server {
    listen 80;
    server_name __CONSOLE_HOST__;
    access_log off;
    error_log /dev/null emerg;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/__API_SERVICE__-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name __CONSOLE_HOST__;
    ssl_certificate /etc/letsencrypt/live/__CONSOLE_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CONSOLE_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null emerg;
    client_max_body_size 64k;
    client_header_timeout 10s;
    limit_req zone=__API_ZONE___console_requests burst=30 nodelay;
    limit_req_status 429;
    limit_conn __API_ZONE___console_connections 20;
    limit_conn_status 429;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/__API_SERVICE__-acme; }
    location / { return 404; }
    # Same-origin read endpoints keep operator credentials scoped to the console.
    location ~ ^(?:/|/assets/(?:operator\.js|sign-in\.js|logo\.svg)|/v1/operator/(?:session|page)|/v1/telemetry/(?:metrics|status|demo))$ {
        proxy_pass http://127.0.0.1:47810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_hide_header Server;
    }
}
