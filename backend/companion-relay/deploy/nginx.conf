# Only this service uses these zones. The trusted proxy list restores client IPs
# before applying limits, including clients rotating libp2p identities.
limit_req_zone $binary_remote_addr zone=companion_relay_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=companion_relay_connections:10m;

server {
    listen 80;
    server_name __RELAY_HOST__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/korus-relay-acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name __RELAY_HOST__;
    ssl_certificate /etc/letsencrypt/live/__RELAY_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__RELAY_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/companion-relay-cloudflare.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    access_log off;
    client_max_body_size 16k;
    client_header_timeout 10s;
    limit_conn companion_relay_connections 50;
    limit_conn_status 429;
    limit_req zone=companion_relay_requests burst=30 nodelay;
    limit_req_status 429;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/korus-relay-acme;
    }
    location = / {
        proxy_pass http://127.0.0.1:47800;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
}
