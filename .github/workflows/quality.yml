name: Quality
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run release-notes:check
      - run: npm run lint
      - run: npm run test:coverage --workspaces -- --maxWorkers=2
      - run: npm run test:scripts
      - run: node scripts/coverage-badge.mjs generate
      - name: Retain coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            core/coverage/
            backend/coverage/
            vue/coverage/
            electron/coverage/
            web/coverage/
            mobile/coverage/
          retention-days: 14
          if-no-files-found: warn

  coverage-badge:
    name: Publish coverage badge
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge
      - name: Publish successful main coverage
        env:
          BADGE_FILE: ${{ runner.temp }}/coverage-badge/badge.json
        run: node scripts/coverage-badge.mjs publish "$BADGE_FILE" "$GITHUB_SHA"
