name: Quality
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automated' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  workspaces:
    name: Discover workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      sdk-revisions: ${{ steps.sdks.outputs.revisions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: list
        run: |
          node -e 'const { workspaces } = require("./package.json"); console.log("matrix=" + JSON.stringify({ include: workspaces.map(workspace => ({ workspace, artifact: workspace.replaceAll("/", "-") })) }));' >> "$GITHUB_OUTPUT"
      - name: Resolve SDK main commits for this run
        id: sdks
        run: |
          revisions=$(node scripts/quality-sdk-sources.mjs resolve)
          echo "revisions=$revisions" >> "$GITHUB_OUTPUT"
          echo "SDK source commits: $revisions" >> "$GITHUB_STEP_SUMMARY"
  checks:
    needs: workspaces
    name: Lint and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check out and build SDK sources
        run: node scripts/quality-sdk-sources.mjs prepare
        env:
          SDK_REVISIONS: ${{ needs.workspaces.outputs.sdk-revisions }}
      - run: npm run release-notes:check
      - run: npm run lint
      - run: npm run test:scripts
  coverage:
    needs: workspaces
    name: Coverage (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.workspaces.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check out and build SDK sources
        run: node scripts/quality-sdk-sources.mjs prepare
        env:
          SDK_REVISIONS: ${{ needs.workspaces.outputs.sdk-revisions }}
      - name: Install the browser the workspace's browser tests drive
        if: matrix.workspace == 'client/vue' || matrix.workspace == 'server/frontend'
        run: npx playwright install --with-deps chromium
      # Public runners have four cores; the Vue suite is the longest job and scales with workers (133 s at 2, 77 s at 4).
      - run: npm run test:coverage --workspace ${{ matrix.workspace }} -- --maxWorkers=${{ matrix.workspace == 'client/vue' && 4 || 2 }}
      - name: Archive workspace coverage
        if: always()
        run: tar -cf coverage.tar "${{ matrix.workspace }}/coverage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.artifact }}
          path: coverage.tar
          retention-days: 14
          if-no-files-found: error
  cli-integration:
    needs: workspaces
    name: CLI integration tests
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check out and build SDK sources
        run: node scripts/quality-sdk-sources.mjs prepare
        env:
          SDK_REVISIONS: ${{ needs.workspaces.outputs.sdk-revisions }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.0.0'
      - run: npm run test:package --workspace @workspace/cli
  quality:
    name: Quality checks
    if: always()
    needs: [workspaces, checks, coverage, cli-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-ci-results.mjs workspaces checks coverage cli-integration
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-results
      - name: Restore all workspace reports
        run: |
          for report in coverage-results/*/coverage.tar; do
            tar -xf "$report"
          done
      - run: node scripts/badges.mjs coverage
      - name: Retain coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: coverage/badge.json
          if-no-files-found: error

  coverage-badge:
    name: Publish coverage badge
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/coverage-badge
      - name: Publish successful main coverage
        env:
          BADGE_FILE: ${{ runner.temp }}/coverage-badge/badge.json
        run: node scripts/badges.mjs publish coverage "$BADGE_FILE" "$GITHUB_SHA"
