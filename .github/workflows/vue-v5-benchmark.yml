name: Vue Vitest 5 benchmark
run-name: Vue Vitest 5 benchmark ${{ github.sha }}
on:
  push:
    branches: [ci/optimization-benchmark]
    paths:
      - '.github/workflows/vue-v5-benchmark.yml'
      - 'scripts/ci-vue-v5-*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-vue-v5-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        order: [v4-first, v5-first]
        rep: [1]
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
      CODEX_APP_SDK_SOURCE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: ./harness/.github/actions/ci-benchmark-setup
        with:
          ref: fcaab1b3a71d6838a3c1b5e8b6ecef6eb2f4bc69
          label: initial-${{ matrix.order }}-${{ matrix.rep }}
          node: 26.12.1
          npm: 10.9.4
          tools: 'false'
          ignore-scripts: 'false'
      - run: python ../harness/scripts/ci-vue-v5-pair.py --order ${{ matrix.order }} --rep ${{ matrix.rep }} --workers 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pair-${{ matrix.order }}-${{ matrix.rep }}
          path: source/benchmark-results/pair-${{ matrix.order }}-${{ matrix.rep }}/
          if-no-files-found: error
          retention-days: 14
  comparison:
    if: always()
    needs: [pairs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pair-*
          path: results
      - name: Require full tests, coverage supersets, and every successful pair
        env:
          CI_BENCH_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python harness/scripts/ci-vue-v5-compare.py --input results
          --expect pair-v4-first-1
          --expect pair-v5-first-1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vue-v5-summary
          path: results/vue-v5-summary.json
          if-no-files-found: error
          retention-days: 14
