name: Vue test benchmark
run-name: Vue test benchmark ${{ github.sha }}
on:
  push:
    branches: [ci/optimization-benchmark]
    paths:
      - '.github/workflows/vue-test-benchmark.yml'
      - 'scripts/ci-vue-test-*'
  workflow_dispatch:
    inputs:
      source_ref:
        type: string
        default: fcaab1b3a71d6838a3c1b5e8b6ecef6eb2f4bc69
        required: true
        description: Frozen source commit for every worker configuration
permissions:
  contents: read
concurrency:
  group: ci-vue-test-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        workers: [2, 3, 4]
        rep: [1, 2]
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: ./harness/.github/actions/ci-benchmark-setup
        with:
          ref: ${{ inputs.source_ref || 'fcaab1b3a71d6838a3c1b5e8b6ecef6eb2f4bc69' }}
          label: vue-workers-${{ matrix.workers }}-${{ matrix.rep }}
          node: 26.12.1
          npm: 10.9.4
          tools: 'false'
          ignore-scripts: 'false'
      - run: |
          node ../harness/scripts/ci-vue-test-prepare.mjs workers-${{ matrix.workers }}
          lscpu --json > benchmark-results/cpu.json
      - run: >-
          python ../harness/scripts/ci-benchmark.py run
          --label vue-workers-${{ matrix.workers }}-${{ matrix.rep }}
          --output benchmark-results -- npm run test:coverage --workspace vue --
          --maxWorkers=${{ matrix.workers }} --silent=passed-only
          --reporter=default --reporter=json --outputFile.json=../benchmark-results/tests.json
          --coverage.reportsDirectory=../benchmark-results/coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vue-run-${{ matrix.workers }}-${{ matrix.rep }}
          path: source/benchmark-results/
          if-no-files-found: error
          retention-days: 7
  comparison:
    if: always()
    needs: [runs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vue-run-*
          path: results
      - name: Require every run, exact tests and full coverage gate
        env:
          CI_BENCH_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python harness/scripts/ci-vue-test-benchmark.py --input results
          --expect vue-workers-2-1 --expect vue-workers-2-2
          --expect vue-workers-3-1 --expect vue-workers-3-2
          --expect vue-workers-4-1 --expect vue-workers-4-2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vue-performance-summary
          path: results/vue-performance-summary.json
          if-no-files-found: error
          retention-days: 14
