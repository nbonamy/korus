name: Update download badge
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads-badge:
    name: Publish package downloads
    if: github.repository == 'nbonamy/korus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: badges-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Count application package downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_FILE: ${{ runner.temp }}/downloads.json
        run: node scripts/badges.mjs downloads "$BADGE_FILE"
      - name: Publish changed download count
        env:
          BADGE_FILE: ${{ runner.temp }}/downloads.json
        run: node scripts/badges.mjs publish downloads "$BADGE_FILE" "$GITHUB_SHA"
