name: Release benchmark
run-name: Release benchmark ${{ inputs.variant || 'compare' }} ${{ github.sha }}
'on':
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options:
        - compare
        - baseline
        - optimized
        default: compare
        required: true
        description: Baseline or optimized pipeline
      baseline_ref:
        type: string
        default: 947552e70dbbc6b87c2a621048cfb021304b331e
        required: true
        description: Frozen baseline commit SHA
  push:
    branches:
    - ci/optimization-benchmark
    paths-ignore:
    - '.github/workflows/vue-test-benchmark.yml'
    - 'scripts/ci-vue-*'
    - '.github/workflows/vue-v5-benchmark.yml'
    - '.github/workflows/ci-benchmark.yml'
    - '.github/workflows/release-benchmark.yml'
permissions:
  contents: read
concurrency:
  group: ci-optimization-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ inputs.baseline_ref || '947552e70dbbc6b87c2a621048cfb021304b331e' }}
        label: baseline-release-tests
        node: 26.12.1
        npm: 10.9.4
        ignore-scripts: 'false'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label baseline-release-tests --output benchmark-results -- bash
        -eo pipefail -c 'npm run release-notes:check && npm run test --workspaces -- --maxWorkers=2 && npm run test:scripts'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-release-tests
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-release-${{ matrix.workspace }}
        node: 26.12.1
        npm: 10.9.4
        ignore-scripts: 'false'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-release-${{ matrix.workspace }} --output benchmark-results
        -- npm run test --workspace ${{ matrix.workspace }} -- --maxWorkers=2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-release-${{ matrix.workspace }}
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    strategy:
      fail-fast: false
      matrix:
        workspace:
        - core
        - backend
        - vue
        - electron
        - web
        - mobile
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: optimized-release-scripts
        node: 26.12.1
        npm: 10.9.4
        ignore-scripts: 'false'
        tools: 'false'
    - run: python ../harness/scripts/ci-benchmark.py run --label optimized-release-scripts --output benchmark-results -- bash
        -eo pipefail -c 'npm run release-notes:check && npm run test:scripts'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-release-scripts
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    if: ${{ (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
  baseline-gate:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'baseline') }}
    needs:
    - baseline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: baseline-release-*
        path: results
    - name: Require every expected successful result
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py aggregate --input results --expect baseline-release-tests
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: baseline-release-summary
        path: results/summary.json
        if-no-files-found: error
  optimized-gate:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare' || inputs.variant == 'optimized') }}
    needs:
    - tests
    - scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: optimized-release-*
        path: results
    - name: Require every expected successful result
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py aggregate --input results --expect optimized-release-core --expect optimized-release-backend
        --expect optimized-release-vue --expect optimized-release-electron --expect optimized-release-web --expect optimized-release-mobile
        --expect optimized-release-scripts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: optimized-release-summary
        path: results/summary.json
        if-no-files-found: error
  baseline-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
      APP_SKIP_SIGNING: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot libevdev-dev
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ inputs.baseline_ref || '947552e70dbbc6b87c2a621048cfb021304b331e' }}
        label: release-baseline-${{ matrix.target }}
        node: 26.12.1
        npm: 10.9.4
        ignore-scripts: 'false'
        tools: 'false'
    - run: 'bench_toolchain_hash=$(printf "%s\n" "$ImageOS" "$ImageVersion" "$(swift --version)" "$(xcodebuild -version)"
        | shasum -a 256 | cut -d " " -f 1)

        echo "hash=$bench_toolchain_hash" >> "$GITHUB_OUTPUT"'
      if: ${{ runner.os == 'macOS' }}
      id: toolchain
    - name: Test signing cleanup
      if: ${{ runner.os == 'macOS' }}
      run: node --test scripts/macos-keychain.test.mjs
    - name: Test Windows ZIP packaging
      if: ${{ runner.os == 'Windows' }}
      run: node --test scripts/windows-zip-maker.test.mjs
    - run: python ../harness/scripts/ci-benchmark.py run --label release-baseline-${{ matrix.target }} --output benchmark-results
        -- npm run make:electron
    - run: python ../harness/scripts/ci-benchmark.py run --label release-baseline-${{ matrix.target }}-smoke --output benchmark-results
        -- node scripts/smoke-desktop.mjs
    - run: python -c "import os,json,pathlib;pathlib.Path('benchmark-results/cache.json').write_text(json.dumps({'tts_cache_hit':os.environ['BENCH_CACHE_HIT']}))"
      env:
        BENCH_CACHE_HIT: 'false'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-baseline-${{ matrix.target }}
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    needs:
    - baseline-gate
    if: ${{ always() && needs.baseline-gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          runner: macos-latest
        - target: win32-x64
          runner: windows-latest
        - target: linux-x64
          runner: ubuntu-latest
        - target: linux-arm64
          runner: ubuntu-24.04-arm
  optimized-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI_BENCH_FAST: '0'
      APP_SKIP_SIGNING: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - run: sudo apt-get update && sudo apt-get install -y rpm fakeroot libevdev-dev
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
    - uses: ./harness/.github/actions/ci-benchmark-setup
      with:
        ref: ${{ github.sha }}
        label: release-optimized-${{ matrix.target }}
        node: 26.12.1
        npm: 10.9.4
        ignore-scripts: 'false'
        tools: 'false'
    - run: 'bench_toolchain_hash=$(printf "%s\n" "$ImageOS" "$ImageVersion" "$(swift --version)" "$(xcodebuild -version)"
        | shasum -a 256 | cut -d " " -f 1)

        echo "hash=$bench_toolchain_hash" >> "$GITHUB_OUTPUT"'
      if: ${{ runner.os == 'macOS' }}
      id: toolchain
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      if: ${{ runner.os == 'macOS' }}
      id: tts-cache
      with:
        path: source/native/tts-helper/.build
        key: ci-benchmark-unsigned-tts-release-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('source/native/tts-helper/Package.swift',
          'source/native/tts-helper/Package.resolved', 'source/native/tts-helper/Sources/**', 'source/scripts/prepare-tts-helper.mjs')
          }}
    - name: Test signing cleanup
      if: ${{ runner.os == 'macOS' }}
      run: node --test scripts/macos-keychain.test.mjs
    - name: Test Windows ZIP packaging
      if: ${{ runner.os == 'Windows' }}
      run: node --test scripts/windows-zip-maker.test.mjs
    - run: python ../harness/scripts/ci-benchmark.py run --label release-optimized-${{ matrix.target }} --output benchmark-results
        -- npm run make:electron
    - run: python ../harness/scripts/ci-benchmark.py run --label release-optimized-${{ matrix.target }}-smoke --output benchmark-results
        -- node scripts/smoke-desktop.mjs
    - run: python -c "import os,json,pathlib;pathlib.Path('benchmark-results/cache.json').write_text(json.dumps({'tts_cache_hit':os.environ['BENCH_CACHE_HIT']}))"
      env:
        BENCH_CACHE_HIT: ${{ steps.tts-cache.outputs.cache-hit || 'false' }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: release-optimized-${{ matrix.target }}
        path: source/benchmark-results/
        if-no-files-found: error
        retention-days: 14
    needs:
    - optimized-gate
    if: ${{ always() && needs.optimized-gate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          runner: macos-latest
        - target: win32-x64
          runner: windows-latest
        - target: linux-x64
          runner: ubuntu-latest
        - target: linux-arm64
          runner: ubuntu-24.04-arm
  comparison:
    if: ${{ always() && (github.event_name == 'push' || inputs.variant == 'compare') }}
    needs:
    - baseline-build
    - optimized-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        path: harness
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: baseline-*
        path: results
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: optimized-*
        path: results
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: release-*
        path: results
    - name: Require identical product test counts and coverage file sets
      env:
        CI_BENCH_NEEDS: ${{ toJSON(needs) }}
      run: python harness/scripts/ci-benchmark.py compare --input results
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: benchmark-comparison
        path: results/comparison.json
        if-no-files-found: error
        retention-days: 14
