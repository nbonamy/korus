name: Migrate Actions secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'nbonamy/korus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Transfer repository secrets
        env:
          GH_TOKEN: ${{ secrets.SECRET_MIGRATION_TOKEN }}
          SOURCE_SECRETS: ${{ toJSON(secrets) }}
        run: node scripts/migrate-actions-secrets.mjs
