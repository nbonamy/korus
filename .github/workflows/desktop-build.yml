name: Desktop release
run-name: desktop ${{ github.ref_name }} ${{ inputs.channel }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (none is build-only validation of any ref)
        type: choice
        options: [prerelease, latest, none]
        default: prerelease
        required: true

permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  workspaces:
    name: Discover workspaces
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: list
        run: |
          node -e 'const { workspaces } = require("./package.json"); console.log("matrix=" + JSON.stringify({ include: workspaces.map(workspace => ({ workspace, artifact: workspace.replaceAll("/", "-") })) }));' >> "$GITHUB_OUTPUT"
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate release ref
        if: inputs.channel != 'none'
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install script-test browser and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run release-notes:check
      - run: npm run test:scripts
  tests:
    needs: workspaces
    name: Tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.workspaces.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run test --workspace ${{ matrix.workspace }} -- --maxWorkers=2
  quality:
    name: quality
    if: always()
    needs: [workspaces, checks, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-ci-results.mjs workspaces checks tests
        env:
          CI_RESULTS: ${{ toJSON(needs) }}

  build:
    name: build (${{ matrix.target }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: desktop-build
    env:
      APP_GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
      APP_GITLAB_CLIENT_ID: ${{ secrets.APP_GITLAB_CLIENT_ID }}
      APP_LINEAR_CLIENT_ID: ${{ secrets.APP_LINEAR_CLIENT_ID }}
      APP_TELEMETRY_ENDPOINT: ${{ secrets.APP_TELEMETRY_ENDPOINT }}
      APP_COMPANION_RELAY_URL: ${{ secrets.APP_COMPANION_RELAY_URL }}
      APP_COMPANION_RELAY_PEER_ID: ${{ secrets.APP_COMPANION_RELAY_PEER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot libevdev-dev
      - run: npm install --global npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Identify unsigned helper toolchain
        if: runner.os == 'macOS'
        id: toolchain
        shell: bash
        run: |
          hash=$(printf '%s\n' "$ImageOS" "$ImageVersion" "$(swift --version)" "$(xcodebuild -version)" | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Cache unsigned Swift build intermediates
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/tts-helper/.build
          key: unsigned-tts-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('native/tts-helper/Package.swift', 'native/tts-helper/Package.resolved', 'native/tts-helper/Sources/**', 'scripts/prepare-tts-helper.mjs') }}
      - name: Test macOS signing cleanup
        if: runner.os == 'macOS'
        run: node --test scripts/macos-keychain.test.mjs
      - name: Test Windows ZIP packaging
        if: runner.os == 'Windows'
        run: node --test scripts/windows-zip-maker.test.mjs
      - name: Signed and notarized macOS build
        if: runner.os == 'macOS'
        run: npm run release:ci-build
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          IDENTITY_DARWIN_CODE: ${{ secrets.IDENTITY_DARWIN_CODE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: node scripts/macos-keychain.mjs cleanup
      - name: Unsigned Windows or Linux build
        if: runner.os != 'macOS'
        run: npm run make:electron
      - name: Exercise packaged native runtimes and bundled iOS companion
        run: node scripts/smoke-desktop.mjs
      - name: Collect installers
        run: node scripts/release-artifacts.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/release/${{ matrix.target }}
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: publish
    needs: [quality, build]
    if: inputs.channel != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.12.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: out/downloaded
      - name: Stage installers and publish GitHub release
        run: node scripts/publish-desktop.mjs out/downloaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
