name: Desktop release
run-name: desktop ${{ github.ref_name }} ${{ inputs.channel }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (none is build-only validation of any ref)
        type: choice
        options: [prerelease, latest, none]
        default: prerelease
        required: true

permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Validate release ref
        if: inputs.channel != 'none'
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm install --global npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run release-notes:check
      - run: npm run test --workspaces -- --maxWorkers=2
      - run: npm run test:scripts

  build:
    name: build (${{ matrix.target }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: desktop-build
    env:
      APP_GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
      APP_LINEAR_CLIENT_ID: ${{ secrets.APP_LINEAR_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot libevdev-dev
      - run: npm install --global npm@10.9.4
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Test macOS signing cleanup
        if: runner.os == 'macOS'
        run: node --test scripts/macos-keychain.test.mjs
      - name: Signed and notarized macOS build
        if: runner.os == 'macOS'
        run: npm run release:ci-build
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          IDENTITY_DARWIN_CODE: ${{ secrets.IDENTITY_DARWIN_CODE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        run: node scripts/macos-keychain.mjs cleanup
      - name: Unsigned Windows or Linux build
        if: runner.os != 'macOS'
        run: npm run make:electron
      - name: Exercise packaged native runtimes and bundled iOS companion
        run: node scripts/smoke-desktop.mjs
      - name: Collect installers
        run: node scripts/release-artifacts.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/release/${{ matrix.target }}
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: publish
    needs: [quality, build]
    if: inputs.channel != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: out/downloaded
      - name: Stage installers and publish GitHub release
        run: node scripts/publish-desktop.mjs out/downloaded
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
